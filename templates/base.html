<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Flask Portfolio{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <a class="brand" href="{{ url_for('index') }}">MY PORTFOLIO</a>
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">☰</button>
        <div class="nav-links" id="navLinks">
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('profile') }}">Profile</a>
            <a href="{{ url_for('area') }}">Area Calculator</a>
            <a href="{{ url_for('linkedlist') }}">Linked List</a>
            <a href="{{ url_for('contact') }}">Contact</a>
        </div>
    </nav>

    <main>{% block content %}{% endblock %}</main>

    <footer>
        <p>Flask Personal Portfolio</p>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
